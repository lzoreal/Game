name: Build Windows packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executables
        run: python -m PyInstaller --noconfirm --clean GameMagNet.spec

      - name: Zip onedir build
        shell: pwsh
        run: Compress-Archive -Path dist/GameMagNet -DestinationPath dist/GameMagNet-windows.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameMagNet-windows
          path: |
            dist/GameMagNet.exe
            dist/GameMagNet-windows.zip
          if-no-files-found: error

      - name: Attach packages to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/GameMagNet.exe dist/GameMagNet-windows.zip --clobber
