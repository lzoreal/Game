name: Build Windows packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Sync version from release tag
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          node scripts/sync-version.mjs $tag

      - name: Run Rust tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Build executable and installer
        run: npm run build

      - name: Prepare portable package
        run: |
          New-Item -ItemType Directory -Force dist/GameMagNet/sources | Out-Null
          Copy-Item src-tauri/target/release/gamemagnet.exe dist/GameMagNet/GameMagNet.exe
          Copy-Item src-tauri/target/release/gamemagnet.exe dist/GameMagNet.exe
          Compress-Archive -Path dist/GameMagNet/* -DestinationPath dist/GameMagNet-windows.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameMagNet-windows
          path: |
            dist/GameMagNet.exe
            dist/GameMagNet-windows.zip
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach packages to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @("dist/GameMagNet.exe", "dist/GameMagNet-windows.zip")
          $files += Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { $_.FullName }
          gh release upload "${{ github.event.release.tag_name }}" @files --clobber
