[package]
name = "gamemagnet"
version = "1.3.0"
description = "Hydra game source manager"
edition = "2021"
rust-version = "1.77"

[lib]
name = "gamemagnet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
unicode-normalization = "0.1"
regex = "1"
sha2 = "0.10"
html-escape = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "gzip"] }
winreg = "0.56"
arboard = { version = "3", default-features = false }
rfd = "0.15"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Dwm"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
